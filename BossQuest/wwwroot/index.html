<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BossQuest - Conquer Your Studies. Slay Your Deadlines.</title>
    <base href="/" />

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <HeadOutlet />
</head>

<body class="bg-slate-950 text-white font-sans overflow-x-hidden">
    <div id="app">
        <!-- Fantasy Game Loading Screen -->
        <div class="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-6 text-center">
            <div class="relative mb-6">
                <span class="text-6xl animate-bounce block">⚔️</span>
                <div class="absolute -inset-4 bg-purple-500/20 rounded-full blur-xl -z-10 animate-pulse"></div>
            </div>
            <h2 class="text-2xl font-black bg-gradient-to-r from-purple-400 via-pink-500 to-red-500 bg-clip-text text-transparent">
                Loading BossQuest...
            </h2>
            <p class="text-xs text-slate-400 mt-2 font-mono">
                Gathering party members & preparing study raid...
            </p>
            <div class="w-48 h-1.5 bg-slate-800 rounded-full overflow-hidden mt-6 mx-auto">
                <div class="w-full h-full bg-gradient-to-r from-purple-600 to-pink-500 animate-pulse"></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" class="hidden fixed bottom-4 right-4 bg-red-950 border border-red-500 text-white p-4 rounded-xl shadow-2xl z-50 text-xs">
        An unhandled error has occurred.
        <a href="" class="reload underline font-bold ml-2">Reload</a>
        <a class="dismiss cursor-pointer ml-2">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
